version: "3.9"

services:
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: raas-gateway
    env_file:
      - services/gateway/.env
    depends_on:
      auth:
        condition: service_started
      document:
        condition: service_started
      retrieval:
        condition: service_started
    ports:
      - "8080:8080"
    networks:
      - backend

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: raas-auth
    env_file:
      - services/auth/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "50051:50051"
    networks:
      - backend

  document:
    build:
      context: .
      dockerfile: services/document/Dockerfile
    container_name: raas-document
    env_file:
      - services/document/.env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "50052:50051"
    networks:
      - backend

  retrieval:
    build:
      context: .
      dockerfile: services/retrieval/Dockerfile
    container_name: raas-retrieval
    env_file:
      - services/retrieval/.env
    depends_on:
      qdrant:
        condition: service_started
    ports:
      - "50053:50051"
    networks:
      - backend

  qdrant:
    image: qdrant/qdrant:v1.5.1
    container_name: raas-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - backend

  postgres:
    image: postgres:17-alpine
    container_name: raas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: raas-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - backend

volumes:
  postgres_data:
  qdrant_data:

networks:
  backend:
    driver: bridge
